[project]
name = "dllama"
version = "0.1.0"
description = "Runs Ollama with a fixed config and serves a remote terminal dashboard (CPU/GPU/RAM, models, requests)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "nvidia-ml-py>=12.0",
    "psutil>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
    "textual>=1.0",
    "textual-plotext>=1.0",
    "tomli-w>=1.0",
]

[project.scripts]
dllama = "dllama.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
